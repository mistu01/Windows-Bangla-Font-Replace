name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-validate:
    name: Lint & Validate Code
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fonttools flake8

      - name: Syntax Check & Lint
        run: |
          python -m py_compile merge_bangla.py merge_segoe.py
          python -m flake8 merge_bangla.py merge_segoe.py --count --select=E9,F63,F7,F82 --show-source --statistics
